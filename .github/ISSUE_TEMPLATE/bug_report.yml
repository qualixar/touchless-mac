name: Bug report
description: Something doesn't work as the README says
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `touchless-mac doctor`
      description: Run it in the same Terminal you use for the app and paste everything it prints.
      render: text
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model and macOS version
      placeholder: MacBook Pro M3, macOS 26.1
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - install.sh (one-line installer)
        - Homebrew
        - Release download
        - Built from source (cargo run)
    validations:
      required: true
