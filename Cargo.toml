[package]
name = "touchless-mac"
version = "0.1.0"
edition = "2024"
description = "Control your Mac with your hand, built step by step to learn Rust"
license = "MIT"
authors = ["Varun Pratap Bhardwaj"]

# Cargo reads this list and fetches every crate (Rust package) the program uses.
[dependencies]
# nokhwa talks to the Mac camera.
nokhwa = { version = "0.10", features = ["input-native", "output-threaded"] }
# image gives us a picture type to hold one camera frame.
image = "0.25"
# ort runs the two hand models (ONNX Runtime). Release candidates change their API between
# versions, so we pin this exact one.
ort = "=2.0.0-rc.15"
# enigo moves the mouse and presses keys.
enigo = "0.6"
# anyhow gives one easy error type for the model plumbing. Chapter 5 replaces it with our own.
anyhow = "1"
